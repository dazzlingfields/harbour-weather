name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['dist/**', 'android/**', 'package.json', 'pnpm-lock.yaml', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Build signed release APK and AAB (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check shared application
        run: |
          pnpm check
          pnpm test
          pnpm android:sync
      - name: Prepare release signing
        if: ${{ inputs.release == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Configure the four ANDROID signing secrets before a release build."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/harbour-release.jks"
      - name: Build debug APK
        if: ${{ inputs.release != true }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Build signed release
        if: ${{ inputs.release == true }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/harbour-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Upload APK and app bundle
        uses: actions/upload-artifact@v4
        with:
          name: harbour-android-${{ inputs.release == true && 'release' || 'debug' }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: ${{ always() && inputs.release == true }}
        run: rm -f "$RUNNER_TEMP/harbour-release.jks"
