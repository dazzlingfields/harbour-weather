name: Check chart relay
on:
  push:
    branches: [main]
    paths: ['chart-relay/**', '.github/workflows/charts.yml']
  pull_request:
    paths: ['chart-relay/**', '.github/workflows/charts.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chart-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: node --experimental-strip-types --test tests/relay.test.ts
      - run: pnpm run build
